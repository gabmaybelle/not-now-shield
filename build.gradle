plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "not-now-shield"
}

loom {
	mods {
		"shieldstrip" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Versions are in gradle.properties. The mod needs only Fabric Loader: no Fabric API.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Also builds a -sources jar alongside the mod.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Client game tests: `./gradlew runClientGameTest` starts a real game and right-clicks tools with a
// shield in the off-hand (add `-Pminecraft_version=26.3 -Pfabric_api_version=0.162.0+26.3` to run
// them on 26.3). The tests use Fabric API's test helpers; the mod itself still needs only the loader.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "shieldstrip_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
