plugins {
	id 'fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file and Loom can add the mixin refmap the common mixins need.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	// Named for this mod: the default, fabric-refmap.json, would clash with any other mod built the same way.
	mixin {
		defaultRefmapName = "shieldstrip-refmap.json"
	}
	mods {
		"shieldstrip" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.20.1 has no unobfuscated game: the official Mojang names, applied by Loom.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and plays through
// the checks in src/gametest. Nothing there ships in the jar. Fabric's client game test API
// doesn't exist for 1.20.1, so the harness is the test's own (src/gametest/.../harness) and the
// run is a plain client run with the test source set as a second mod. The tests use Fabric API's
// tick event, so Fabric API is on the test's classpath only; the mod itself needs only the loader.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	createRemapConfigurations(sourceSets.gametest)
	mods {
		"shieldstrip_gametest" {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		clientGameTest {
			client()
			name = "Client Game Test"
			source sourceSets.gametest
			runDir "build/run/clientGameTest"
			property "shieldstrip.gametest", "true"
			// A fixed window so the screenshots are the same size on every machine.
			programArgs "--width", "1280", "--height", "720"
			ideConfigGenerated false
		}
	}
}

dependencies {
	modGametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Loom writes the file players get with remapJar, so that is the name that counts.
tasks.named('jar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('remapJar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('remapSourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }

// The game runs (dev client, game tests) use Java 17, as players' 1.20.1 does: the Mixin of 1.20.1's
// loaders can't read the classes of a newer Java.
tasks.withType(JavaExec).configureEach {
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
}
