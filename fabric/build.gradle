plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// The common sources are compiled straight into this jar (no common jar to bundle), so the
// Fabric mod is one file.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

loom {
	mods {
		"shieldstrip" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// Versions are in gradle.properties. The mod needs only Fabric Loader: no Fabric API.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Client game tests: `./gradlew :fabric:runClientGameTest` starts a real game and right-clicks tools
// with a shield in the off-hand (add `-Pminecraft_version=26.3 -Pfabric_api_version=0.162.0+26.3`
// to run them on 26.3). The tests use Fabric API's test helpers; the mod itself still needs only
// the loader.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "shieldstrip_gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// `./gradlew :fabric:runClientGameTest -PvideoTour` also films the Short (VideoTour), frames in
// build/run/clientGameTest/video_tour. Every other -Pvideo... property is passed on to it:
// -PvideoScenes=<scene,scene,w_*> films only those scenes, -PvideoScout takes one still per scene,
// -PvideoSeed=<seed> picks the world, -PvideoWorld=<zip> films in a saved world, -PvideoStage
// saves the staged world. Without -PvideoTour the game test runs as usual.
if (project.hasProperty("videoTour")) {
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		systemProperty 'shieldstrip.videoTour', 'true'
		project.properties.each { name, value ->
			if (name.startsWith('video') && name != 'videoTour') {
				// A bare flag (-PvideoScout) arrives empty: pass it on as true.
				systemProperty "shieldstrip.${name}", value.toString().isEmpty() ? 'true' : value.toString()
			}
		}
	}
}

dependencies {
	gametestImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// not-now-shield-fabric-<version>.jar, the name players download.
tasks.named('jar') { archiveBaseName = "${rootProject.name}-fabric" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-fabric" }
