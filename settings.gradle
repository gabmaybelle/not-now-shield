pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

rootProject.name = 'not-now-shield'

// `common` holds the mixins and the shield drawing, which don't care which loader runs them.
// `fabric` and `neoforge` compile those sources straight into their own jars (see their
// build.gradle), so there is one codebase and two mod files.
include 'common', 'fabric', 'neoforge'
